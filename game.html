<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>遊戲｜Claw Party</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/game.css">
</head>
<body class="game-page">
<header class="gamebar">
  <a class="btn small" href="index.html">← 返回首頁</a>
  <div class="game-title">🧸 Claw Party</div>
  <div class="bar-actions">
    <a class="btn small" href="settings.html">⚙️ 設定</a>
    <button class="btn small" id="fullscreenBtn">⛶ 全螢幕</button>
  </div>
</header>

<main class="game-wrap">
  <div class="hud">
    <div>🪙 金幣 <strong id="coins">10</strong></div>
    <div>🏆 分數 <strong id="score">0</strong></div>
    <div>⭐ 最高 <strong id="best">0</strong></div>
    <div>🧸 抓到 <strong id="caught">0</strong></div>
    <button class="btn tiny" id="soundBtn">🔊 音效</button>
  </div>

  <div class="machine" id="machine">
    <canvas id="gameCanvas" width="900" height="650"></canvas>
    <div class="message hidden" id="message">
      <div class="message-box">
        <div id="messageEmoji">🎉</div>
        <h2 id="messageTitle">抓到了！</h2>
        <p id="messageText">恭喜你！</p>
        <button class="btn primary" id="continueBtn">繼續</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="control-row">
      <button class="touch-btn" data-action="left">◀</button>
      <button class="touch-btn" data-action="down">▼</button>
      <button class="touch-btn" data-action="right">▶</button>
      <button class="touch-btn claw" data-action="grab">🧲 夾取</button>
    </div>
    <p class="hint">鍵盤：← → 移動、↓ 下降、Space 夾取　｜　Xbox：左類比移動、A 夾取</p>
  </div>
</main>
<script src="js/app.js"></script>
<script src="js/gamepad.js"></script>
<script src="js/claw.js"></script>
</body>
</html>
